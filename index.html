<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#140f1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Valombre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="screen"><canvas id="game"></canvas></div>
      <div id="pad">
        <div id="dpad" aria-label="Croix directionnelle">
          <span class="arm up"></span><span class="arm down"></span>
          <span class="arm left"></span><span class="arm right"></span>
          <span class="hub"></span>
        </div>
        <div id="mid"><button data-btn="start" aria-label="Menu">START</button></div>
        <div id="ab">
          <button data-btn="b" class="round b" aria-label="B">B</button>
          <button data-btn="a" class="round a" aria-label="A">A</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
